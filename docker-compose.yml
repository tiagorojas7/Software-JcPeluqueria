services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jc_barberia
      POSTGRES_PASSWORD: jc_barberia
      POSTGRES_DB: jc_barberia_test
      SHOP_UTC_OFFSET: "-03:00"
    ports:
      - "5432:5432"
    volumes:
      - jc_barberia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jc_barberia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jc_barberia_pgdata:
