packages:
  - "apps/*"
  - "packages/*"
# pnpm blocks dependency build scripts by default: a postinstall script is a
# classic supply-chain attack vector. Each package listed here is an explicit,
# reviewed decision — not a blanket opt-out. Both compile or download native
# binaries and genuinely cannot work without their build step.
allowBuilds:
  esbuild: true # bundler used by Vite and Vitest
  "@swc/core": true # TypeScript compiler used by the NestJS build
  # Transitive deps of testcontainers (via dockerode), pulled in for its
  # ssh:// Docker host support. We only ever talk to the local Docker
  # Desktop npipe/socket, never an SSH-remote daemon, so these native
  # build steps are denied rather than approved — least privilege, and
  # Testcontainers works fine without them for our use case.
  cpu-features: false
  protobufjs: false
  ssh2: false
